#     image: postgres:16
#     environment:
#       - POSTGRES_USER=frepple
#       - POSTGRES_PASSWORD=frepple
#       - POSTGRES_DB=frepple
#       - PGHOST=127.0.0.1
#       - PGPORT=5432
#     ports:
