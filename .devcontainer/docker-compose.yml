#You only need to start this if you have no Postgres already available
#This will launch a Postgres container with local data persistence. 

# services:
#   postgres:
#     image: postgres:16
#     environment:
#       - POSTGRES_USER=frepple
#       - POSTGRES_PASSWORD=frepple
#       - POSTGRES_DB=frepple
#       - PGHOST=127.0.0.1
#       - PGPORT=5432
#     ports:
#       - 5432:5432
#     command: ["postgres", "-c", "log_statement=all"]
#     volumes:
#        - ~/frepple_data:/var/lib/postgresql/data
# version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: frepple-community-postgres
    environment:
      POSTGRES_USER: frepple
      POSTGRES_PASSWORD: frepple
      POSTGRES_DB: frepple
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "log_statement=all"]
    volumes:
      - ~/frepple_data:/var/lib/postgresql/data

  webserver:
    image: ghcr.io/frepple/frepple-community:9.13.0
    container_name: frepple-community-webserver
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: frepple
      POSTGRES_PASSWORD: frepple
      POSTGRES_DB: frepple
    platform: linux/amd64
    ports:
      - "9000:80"
      - "8000:8000"
    volumes:
      - ..:/app