{% extends "input/operationplanreport.html" %}
{% load i18n %}

{% block extrahead %}
{{ block.super }}
<style>
    :root {
        --primary-purple: #7B2D8E;
        --deep-purple: #2D004D;
        --bright-accent: #9C27B0;
        --soft-purple-bg: rgba(123, 45, 142, 0.04);
        --border-color: #E5E7EB;
        --card-bg: #FFFFFF;
        --text-primary: #1A1A1A;
        --text-secondary: #6B7280;
        --success-green: #10B981;
        --error-red: #EF4444;
        --warning-orange: #F59E0B;
    }

    /* Modernizing the page header */
    #content > h1 {
        display: none;
    }

    /* Grid container modernization */
    #content-main {
        background: var(--card-bg);
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(45, 0, 77, 0.05);
        border: 1px solid var(--border-color);
        padding: 1.5rem;
        margin-top: 1rem !important;
    }

    /* Toolbar buttons modernization */
    .btn-primary, #save, #undo, #toolicons .btn, #gridmode, #kanbanmode, #calendarmode, #ganttmode {
        background: var(--primary-purple) !important;
        border: none !important;
        border-radius: 8px !important;
        padding: 0.5rem 1.25rem !important;
        font-weight: 600 !important;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
        box-shadow: 0 2px 4px rgba(123, 45, 142, 0.1) !important;
        color: white !important;
    }

    .btn-primary:hover, #save:hover, #undo:hover, #toolicons .btn:hover, #gridmode:hover, #kanbanmode:hover, #calendarmode:hover, #ganttmode:hover {
        background: var(--deep-purple) !important;
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(123, 45, 142, 0.2) !important;
    }

    .btn-primary.active, #gridmode.active, #kanbanmode.active, #calendarmode.active, #ganttmode.active {
        background: var(--deep-purple) !important;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.2) !important;
    }

    /* Dropdown specialization */
    .dropdown-menu {
        border-radius: 12px !important;
        border: 1px solid var(--border-color) !important;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important;
        padding: 0.5rem !important;
    }

    .dropdown-item {
        border-radius: 6px !important;
        padding: 0.5rem 1rem !important;
        transition: all 0.2s !important;
    }

    .dropdown-item:hover {
        background-color: var(--soft-purple-bg) !important;
        color: var(--primary-purple) !important;
    }

    /* Action button specialized styling */
    #actions1 {
        background: white !important;
        color: var(--primary-purple) !important;
        border: 1px solid rgba(123, 45, 142, 0.2) !important;
        border-radius: 8px !important;
    }

    #actions1:hover {
        background: var(--soft-purple-bg) !important;
    }

    /* Grid styling */
    .ui-jqgrid .ui-jqgrid-hdiv {
        background: linear-gradient(to bottom, #F8F4FC, #FFFFFF) !important;
        border-bottom: 2px solid var(--primary-purple) !important;
    }

    .ui-jqgrid .ui-jqgrid-htable th {
        color: var(--deep-purple) !important;
        font-weight: 700 !important;
        padding: 15px 10px !important;
        text-transform: uppercase;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
    }

    .ui-jqgrid tr.ui-row-ltr td {
        border-bottom: 1px solid #F3F4F6 !important;
        padding: 12px 10px !important;
        font-size: 0.85rem;
    }

    .ui-jqgrid tr.ui-state-hover td {
        background-color: var(--soft-purple-bg) !important;
    }

    /* Fix for checkbox column alignment */
    .ui-jqgrid tr.ui-row-ltr td.td_cbox, 
    .ui-jqgrid tr.ui-row-ltr td[aria-describedby="grid_cb"],
    .ui-jqgrid .ui-jqgrid-htable th#grid_cb {
        padding: 12px 0px !important;
        text-align: center;
        width: 45px !important;
        position: relative;
        z-index: 10;
    }

    .ui-jqgrid tr.ui-row-ltr td.td_cbox input,
    #grid_cb input {
        margin: 0 !important;
        cursor: pointer;
        accent-color: var(--primary-purple);
        transform: scale(1.1);
    }

    /* Search box styling */
    #addsearch {
        border-radius: 8px 0 0 8px !important;
        border: 1px solid var(--border-color) !important;
        padding: 0.5rem 1rem !important;
    }

    .input-group-text {
        background: white !important;
        border: 1px solid var(--border-color) !important;
        border-left: none !important;
        border-radius: 0 8px 8px 0 !important;
        color: var(--primary-purple) !important;
    }

    /* Pager styling */
    #gridpager {
        background: #FFFFFF !important;
        border: none !important;
        border-top: 1px solid var(--border-color) !important;
        padding: 12px 0 !important;
    }

    /* Custom Header Styles */
    .header-badge {
        background: var(--soft-purple-bg);
        border: 1px solid rgba(123, 45, 142, 0.1);
        border-radius: 20px;
        color: var(--primary-purple) !important;
        font-weight: 600;
        padding: 0.5rem 1rem;
    }
</style>
{% endblock %}

{% block before_table %}
<div class="modern-header-container mb-4">
    <div class="row align-items-center">
        <div class="col">
            <p class="text-muted small mb-1">{% trans "Capacity Planning" %}</p>
            <h2 class="m-0" style="color: var(--deep-purple); font-weight: 800; letter-spacing: -0.02em;">
                {% trans "Resource detail" %}
            </h2>
        </div>
        <div class="col-auto">
            <div class="header-badge">
                <i class="fa fa-info-circle me-1"></i> {% trans "Detailed view of resource activities and load" %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
