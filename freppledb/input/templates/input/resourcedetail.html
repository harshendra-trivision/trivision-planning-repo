{% extends "input/operationplanreport.html" %}
{% load i18n %}

{% block extrahead %}
{{ block.super }}
<style>
    /* ---- Resource Detail Page Refinements ---- */

    /* Checkbox column alignment */
    .ui-jqgrid tr.ui-row-ltr td.td_cbox,
    .ui-jqgrid tr.ui-row-ltr td[aria-describedby="grid_cb"],
    .ui-jqgrid .ui-jqgrid-htable th#grid_cb {
        padding: 0.5rem 0 !important;
        text-align: center;
        width: 45px !important;
    }

    .ui-jqgrid tr.ui-row-ltr td.td_cbox input,
    #grid_cb input {
        margin: 0 auto !important;
        display: block;
    }

    /* View mode toggle active state */
    .btn-primary.active,
    #gridmode.active, #kanbanmode.active, #calendarmode.active, #ganttmode.active {
        background: linear-gradient(135deg, #2D004D 0%, #5A1B6B 100%) !important;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.15) !important;
    }

    /* Dropdown refinements */
    .dropdown-menu {
        border-radius: 10px !important;
        border: 1px solid #E8E0F0 !important;
        box-shadow: 0 8px 30px rgba(45, 0, 77, 0.12) !important;
        padding: 0.35rem !important;
        font-family: 'Inter', sans-serif;
    }

    .dropdown-item {
        border-radius: 6px !important;
        padding: 0.45rem 0.85rem !important;
        font-size: 0.82rem;
        transition: all 0.15s ease !important;
    }

    .dropdown-item:hover {
        background: rgba(123, 45, 142, 0.06) !important;
        color: #7B2D8E !important;
    }

    /* Custom Header Badge */
    .header-badge {
        background: rgba(123, 45, 142, 0.04);
        border: 1px solid rgba(123, 45, 142, 0.1);
        border-radius: 20px;
        color: #7B2D8E !important;
        font-weight: 600;
        font-family: 'Inter', sans-serif;
        font-size: 0.82rem;
        padding: 0.5rem 1rem;
    }

    /* Modern header container */
    .modern-header-container {
        font-family: 'Inter', sans-serif;
    }

    .modern-header-container h2 {
        color: #2D004D !important;
        font-weight: 800 !important;
        letter-spacing: -0.02em;
    }

    .modern-header-container .text-muted {
        color: #7B2D8E !important;
        font-weight: 500;
        font-size: 0.78rem;
        letter-spacing: 0.3px;
        text-transform: uppercase;
    }

    /* Selected row count bar */
    .ui-jqgrid .ui-userdata {
        background: linear-gradient(135deg, #F8F5FC 0%, #F3E8FF 100%) !important;
        border-top: 1px solid #E8E0F0 !important;
        color: #2D004D !important;
        font-family: 'Inter', sans-serif;
        font-size: 0.8rem;
        font-weight: 500;
    }
</style>
{% endblock %}

{% block before_table %}
<div class="modern-header-container mb-4">
    <div class="row align-items-center">
        <div class="col">
            <p class="text-muted small mb-1">{% trans "Capacity Planning" %}</p>
            <h2 class="m-0" style="color: var(--deep-purple); font-weight: 800; letter-spacing: -0.02em;">
                {% trans "Resource detail" %}
            </h2>
        </div>
        <div class="col-auto">
            <div class="header-badge">
                <i class="fa fa-info-circle me-1"></i> {% trans "Detailed view of resource activities and load" %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
