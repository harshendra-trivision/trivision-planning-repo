# frePPLe - Docker Compose for local development
# Access the application at http://localhost:8000

services:
  frepple:
    build: .
    container_name: frepple-app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: frepple
      POSTGRES_PASSWORD: frepple
      POSTGRES_DBNAME: frepple
    volumes:
      - frepple-logs:/app/logs
    networks:
      - frepple-network

  postgres:
    image: postgres:16
    container_name: frepple-postgres
    environment:
      POSTGRES_USER: frepple
      POSTGRES_PASSWORD: frepple
      POSTGRES_DB: frepple
    volumes:
      - frepple-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frepple"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - frepple-network

volumes:
  frepple-postgres-data:
  frepple-logs:

networks:
  frepple-network:
    driver: bridge
